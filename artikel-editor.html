<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sortiment · Artikel-Editor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg: #faf7f2;
      --bg-card: #ffffff;
      --bg-soft: #f3ede4;
      --ink: #2a1d12;
      --ink-soft: #6b5a4a;
      --ink-faint: #a89884;
      --line: #e8dfd0;
      --line-soft: #f0e9dd;
      --accent: #c4501f;
      --accent-soft: #f4d9c8;
      --danger: #b53d3d;
      --shadow-sm: 0 1px 2px rgba(42, 29, 18, 0.04);
      --shadow-md: 0 4px 16px rgba(42, 29, 18, 0.06);
      --shadow-lg: 0 24px 60px rgba(42, 29, 18, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app { max-width: 1280px; margin: 0 auto; padding: 32px 32px 96px; }

    /* ---------- Header ---------- */
    .header {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--line);
      gap: 16px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-logo {
      width: 56px; height: 56px; flex: 0 0 56px;
      background-size: contain; background-position: center;
      background-repeat: no-repeat;
    }
    .brand-eyebrow {
      font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-faint); font-weight: 500; margin-bottom: 4px;
    }
    .brand-eyebrow .dirty { color: var(--accent); font-weight: 700; }
    .brand-title {
      font-family: 'Instrument Serif', serif;
      font-size: 44px; line-height: 1; letter-spacing: -0.02em; font-weight: 400; margin: 0;
    }
    .brand-title em { font-style: italic; color: var(--accent); font-size: 0.7em; vertical-align: 0.1em; }
    .toolbar { display: flex; gap: 8px; align-items: center; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 14px; border-radius: 8px;
      font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 120ms;
      border: 1px solid transparent; background: transparent; color: var(--ink);
    }
    .btn:hover { background: var(--bg-soft); }
    .btn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .btn-primary:hover { background: #1a120a; }
    .btn-accent { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-accent:hover { background: #a8421a; }
    .btn-ghost { background: transparent; border-color: var(--line); }
    .btn-ghost:hover { border-color: var(--ink); background: transparent; }

    /* ---------- GitHub Save Button ---------- */
    .btn-github { background: #24292f; color: white; border-color: #24292f; }
    .btn-github:hover:not(:disabled) { background: #1c2025; }
    .btn-github:disabled { opacity: 0.5; cursor: not-allowed; }
    .gh-status-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 6px; vertical-align: middle;
    }
    .gh-status-dot.ready { background: #2ea043; }
    .gh-status-dot.unset { background: var(--ink-faint); }

    /* ---------- Modal ---------- */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(42, 29, 18, 0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 24px;
    }
    .modal {
      background: var(--bg-card); border-radius: 16px;
      box-shadow: var(--shadow-lg);
      width: 100%; max-width: 520px; max-height: 90vh; overflow: auto;
      padding: 28px;
    }
    .modal h2 {
      margin: 0 0 6px; font-family: 'Instrument Serif', serif;
      font-size: 28px; font-weight: 400;
    }
    .modal-sub {
      color: var(--ink-soft); font-size: 13px; margin-bottom: 22px;
      line-height: 1.55;
    }
    .modal-sub code {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      background: var(--bg-soft); padding: 1px 6px; border-radius: 4px;
    }
    .modal-field { margin-bottom: 14px; }
    .modal-field label {
      display: block; font-size: 12px; font-weight: 500;
      color: var(--ink-soft); margin-bottom: 4px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .modal-field input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line);
      border-radius: 8px; font-family: 'JetBrains Mono', monospace;
      font-size: 13px; background: var(--bg-card); color: var(--ink);
    }
    .modal-field input:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .modal-field .hint {
      font-size: 11px; color: var(--ink-faint); margin-top: 4px;
    }
    .modal-actions {
      display: flex; justify-content: space-between; gap: 8px;
      margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line);
    }
    .modal-actions-left { display: flex; gap: 8px; }
    .modal-actions-right { display: flex; gap: 8px; }
    .token-help {
      background: var(--bg-soft); border-radius: 8px; padding: 14px;
      font-size: 12px; line-height: 1.55; margin-bottom: 18px;
      color: var(--ink-soft);
    }
    .token-help b { color: var(--ink); }
    .token-help a { color: var(--accent); text-decoration: none; }
    .token-help a:hover { text-decoration: underline; }
    .token-help ol { margin: 6px 0 0 0; padding-left: 18px; }
    .token-help li { margin-bottom: 2px; }

    /* ---------- Stats ---------- */
    .stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat {
      flex: 1; min-width: 180px; padding: 16px 20px;
      background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px;
    }
    .stat-label {
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ink-faint); margin-bottom: 6px; font-weight: 500;
    }
    .stat-value { font-family: 'Instrument Serif', serif; font-size: 32px; line-height: 1; }
    .stat-value .currency { color: var(--ink-faint); font-size: 0.6em; margin-left: 4px; }

    /* ---------- Filters ---------- */
    .filters { display: flex; gap: 16px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
    .tabs { display: flex; gap: 2px; padding: 4px; background: var(--bg-soft); border-radius: 10px; }
    .tab {
      padding: 7px 14px; border-radius: 7px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      color: var(--ink-soft); border: none; background: transparent;
      font-family: inherit; transition: all 120ms;
    }
    .tab:hover { color: var(--ink); }
    .tab.active { background: var(--bg-card); color: var(--ink); box-shadow: var(--shadow-sm); }
    .tab-count { margin-left: 4px; font-size: 11px; color: var(--ink-faint); }
    .tab.active .tab-count { color: var(--accent); }

    .search { margin-left: auto; position: relative; }
    .search input {
      padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg-card); font-family: inherit; font-size: 13px; width: 220px;
      transition: all 120ms; color: var(--ink);
    }
    .search input:focus { outline: none; border-color: var(--ink); }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--ink-faint); pointer-events: none; font-size: 16px;
    }

    /* ---------- Table ---------- */
    .table-wrap {
      background: var(--bg-card); border: 1px solid var(--line);
      border-radius: 12px; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 12px 16px;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ink-faint); font-weight: 500;
      border-bottom: 1px solid var(--line); background: var(--bg-soft);
    }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--ink); }
    .sort-indicator { margin-left: 4px; opacity: 0.4; }
    th.active-sort .sort-indicator { opacity: 1; color: var(--accent); }
    td { padding: 4px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr.row { transition: background 120ms; }
    tr.row:hover { background: var(--bg-soft); }

    .cell-edit {
      cursor: text; padding: 8px 10px; margin: -8px -10px;
      border-radius: 6px; display: block; min-height: 32px; line-height: 32px;
    }
    .cell-edit:hover { background: var(--accent-soft); }
    .cell-icon { font-size: 22px; line-height: 1; text-align: center; padding: 8px 4px; margin: -8px -4px; }
    .cell-price { font-family: 'JetBrains Mono', monospace; font-weight: 500; text-align: right; }
    .cell-id { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-faint); }

    .badge {
      display: inline-flex; align-items: center; padding: 3px 9px;
      border-radius: 999px; font-size: 11px; font-weight: 500; letter-spacing: 0.02em;
    }
    .badge-Eis      { background: #fde8d3; color: #8a4b1c; }
    .badge-Becher   { background: #fce3e3; color: #963131; }
    .badge-Waffel   { background: #f5e6cf; color: #6b4920; }
    .badge-Getränk  { background: #dde9e5; color: #2c5a4a; }

    .row-actions { display: flex; gap: 4px; justify-content: flex-end; opacity: 0; transition: opacity 120ms; }
    tr.row:hover .row-actions { opacity: 1; }
    .icon-btn {
      width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
      border: none; background: transparent; border-radius: 6px; cursor: pointer;
      color: var(--ink-soft); font-size: 14px; font-family: inherit;
    }
    .icon-btn:hover { background: var(--line); color: var(--ink); }
    .icon-btn.danger:hover { background: var(--danger); color: white; }
    .icon-btn.success:hover { background: #4a7c3a; color: white; }

    /* ---------- Inline edit ---------- */
    .inline-input, .inline-select {
      width: 100%; padding: 8px 10px; margin: -8px -10px;
      border: 2px solid var(--accent); border-radius: 6px;
      font-family: inherit; font-size: inherit; background: white; color: var(--ink);
    }
    .inline-input.mono { font-family: 'JetBrains Mono', monospace; }
    .inline-input:focus, .inline-select:focus { outline: none; }

    /* ---------- Empty / drag / toast ---------- */
    .empty { padding: 60px 20px; text-align: center; color: var(--ink-soft); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-title { font-family: 'Instrument Serif', serif; font-size: 24px; margin-bottom: 8px; color: var(--ink); }

    .drag-overlay {
      position: fixed; inset: 0; background: rgba(196, 80, 31, 0.92);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; backdrop-filter: blur(4px); pointer-events: none;
    }
    .drag-overlay-inner {
      color: white; text-align: center; font-family: 'Instrument Serif', serif; font-size: 56px;
      border: 2px dashed rgba(255,255,255,0.4); padding: 60px 100px; border-radius: 24px;
    }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--bg);
      padding: 12px 20px; border-radius: 10px; font-size: 13px;
      box-shadow: var(--shadow-lg); z-index: 100;
      animation: toast-in 200ms ease-out;
    }
    .toast.error { background: var(--danger); }
    .toast.success { background: #2d4d27; }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    tr.add-row { background: var(--accent-soft) !important; }
    tr.add-row td { padding: 10px 16px; }

    /* ---------- Emoji-Picker ---------- */
    .icon-trigger {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px;
      background: var(--bg-card); border: 2px dashed var(--accent);
      border-radius: 8px; cursor: pointer;
      font-size: 22px; line-height: 1;
      transition: all 120ms;
    }
    .icon-trigger:hover {
      background: var(--accent-soft); border-style: solid;
      transform: scale(1.05);
    }
    .icon-trigger.empty { color: var(--ink-faint); font-size: 16px; font-family: 'DM Sans', sans-serif; font-weight: 500; }

    .emoji-picker {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      width: 360px; max-height: 420px; overflow-y: auto;
      padding: 12px;
      animation: pop-in 140ms ease-out;
    }
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(-6px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .emoji-picker-header {
      display: flex; gap: 6px; align-items: center;
      padding-bottom: 10px; margin-bottom: 8px;
      border-bottom: 1px solid var(--line-soft);
      position: sticky; top: -12px;
      background: var(--bg-card);
      padding-top: 0; margin-top: 0;
      z-index: 1;
    }
    .emoji-picker-custom {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-family: inherit; font-size: 13px;
      background: var(--bg);
    }
    .emoji-picker-custom:focus { outline: none; border-color: var(--accent); }
    .emoji-picker-apply {
      width: 32px; height: 32px;
      border: none; background: var(--accent); color: white;
      border-radius: 6px; cursor: pointer; font-size: 14px; font-family: inherit;
    }
    .emoji-picker-apply:disabled { background: var(--line); cursor: not-allowed; }
    .emoji-group { margin-bottom: 10px; }
    .emoji-group:last-child { margin-bottom: 0; }
    .emoji-group-label {
      font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ink-faint); font-weight: 500; margin-bottom: 4px; padding-left: 2px;
    }
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
    }
    .emoji-btn {
      width: 100%; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      border: none; background: transparent; border-radius: 6px;
      cursor: pointer; font-size: 20px; line-height: 1;
      transition: background 100ms;
      padding: 0;
    }
    .emoji-btn:hover { background: var(--bg-soft); transform: scale(1.15); }
    .emoji-btn.active { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }

    .picker-portal {
      position: fixed; z-index: 200;
    }

    .hint {
      font-size: 12px; color: var(--ink-faint); display: flex; gap: 12px; flex-wrap: wrap;
    }
    .hint kbd {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      background: var(--bg-card); padding: 2px 6px; border-radius: 4px;
      border: 1px solid var(--line); box-shadow: 0 1px 0 var(--line);
    }

    .hidden { display: none !important; }

    /* ---------- Responsive ---------- */
    @media (max-width: 720px) {
      .app { padding: 16px 16px 80px; }
      .brand-title { font-size: 32px; }
      .stats { gap: 8px; }
      .stat { padding: 12px; min-width: 140px; }
      .stat-value { font-size: 24px; }
      .search input { width: 100%; }
      .search { width: 100%; margin-left: 0; }
      th, td { padding: 8px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useMemo, useRef, useEffect, useCallback } = React;

    /* -------- Sample-Daten (werden beim Laden ersetzt) -------- */
    const SAMPLE = {
      artikel: [
        { id: 1,  kategorie: "Eis",     name: "Vanille",       preis: 1.50, icon: "🍦" },
        { id: 2,  kategorie: "Eis",     name: "Schoko",        preis: 1.50, icon: "🍫" },
        { id: 3,  kategorie: "Eis",     name: "Erdbeere",      preis: 1.50, icon: "🍓" },
        { id: 4,  kategorie: "Eis",     name: "Pistazie",      preis: 1.70, icon: "🌰" },
        { id: 5,  kategorie: "Eis",     name: "Stracciatella", preis: 1.50, icon: "🍨" },
        { id: 6,  kategorie: "Eis",     name: "Zitrone",       preis: 1.50, icon: "🍋" },
        { id: 7,  kategorie: "Eis",     name: "Mango",         preis: 1.70, icon: "🥭" },
        { id: 8,  kategorie: "Eis",     name: "Haselnuss",     preis: 1.50, icon: "🌰" },
        { id: 10, kategorie: "Becher",  name: "Spaghetti-Eis", preis: 6.50, icon: "🍝" },
        { id: 11, kategorie: "Becher",  name: "Bananensplit",  preis: 5.90, icon: "🍌" },
        { id: 12, kategorie: "Becher",  name: "Becher Sahne",  preis: 4.50, icon: "🍨" },
        { id: 13, kategorie: "Becher",  name: "Heisse Liebe",  preis: 5.50, icon: "❤" },
        { id: 20, kategorie: "Waffel",  name: "Waffel + Eis",  preis: 4.50, icon: "🧇" },
        { id: 21, kategorie: "Waffel",  name: "Waffel Sahne",  preis: 3.50, icon: "🧇" },
        { id: 30, kategorie: "Getränk", name: "Espresso",      preis: 2.20, icon: "☕" },
        { id: 31, kategorie: "Getränk", name: "Cappuccino",    preis: 3.20, icon: "☕" },
        { id: 32, kategorie: "Getränk", name: "Wasser",        preis: 2.50, icon: "💧" },
        { id: 33, kategorie: "Getränk", name: "Cola",          preis: 2.80, icon: "🥤" }
      ]
    };

    const KATEGORIEN = ["Eis", "Becher", "Waffel", "Getränk"];

    const EMOJI_GROUPS = {
      'Eis & Dessert':    ['🍦','🍨','🍧','🍮','🎂','🧁','🍰','🥧','🍪','🍩','🍡','🧊'],
      'Schoko & Nüsse':   ['🍫','🌰','🥜','🍯'],
      'Früchte':          ['🍓','🍌','🥭','🍋','🍑','🍒','🍇','🍎','🍏','🍐','🍊','🥥','🍉','🍍','🥝','🫐'],
      'Getränke':         ['☕','🍵','🥤','🧋','🥛','💧','🧃','🥃','🍹','🍸','🍺','🍷','🍾','🍶'],
      'Waffel & Gebäck':  ['🧇','🥐','🥖','🍞','🥨','🥞','🍮'],
      'Deko & Symbole':   ['❤','⭐','✨','🌟','🌈','🎉','🔥','🌸','🌺','💫','🎀','👑']
    };

    /* -------- Helpers -------- */
    const fmtPrice = (n) => n.toFixed(2).replace('.', ',');
    const parsePrice = (s) => {
      const cleaned = String(s).replace(',', '.').replace(/[^0-9.\-]/g, '');
      const n = parseFloat(cleaned);
      return isNaN(n) ? 0 : n;
    };

    function buildJSON(artikel) {
      const lines = ['{', '  "artikel": ['];
      artikel.forEach((a, i) => {
        const name = String(a.name).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
        const json = `    { "id": ${a.id}, "kategorie": "${a.kategorie}", "name": "${name}", "preis": ${a.preis.toFixed(2)}, "icon": "${a.icon}" }`;
        lines.push(json + (i < artikel.length - 1 ? ',' : ''));
      });
      lines.push('  ]');
      lines.push('}');
      return lines.join('\n');
    }

    /* ============================ EmojiPicker ============================ */
    function EmojiPicker({ value, onSelect, onClose, anchorEl }) {
      const [custom, setCustom] = useState('');
      const ref = useRef();
      const [pos, setPos] = useState({ left: -9999, top: -9999 });

      // Position relativ zum Anker berechnen, on-screen halten
      useEffect(() => {
        if (!anchorEl) return;
        const rect = anchorEl.getBoundingClientRect();
        const pickerW = 360, pickerH = 420, margin = 12;
        let left = rect.left;
        let top  = rect.bottom + 8;
        if (left + pickerW > window.innerWidth - margin)
          left = window.innerWidth - pickerW - margin;
        if (left < margin) left = margin;
        if (top + pickerH > window.innerHeight - margin) {
          const above = rect.top - pickerH - 8;
          top = above > margin ? above : Math.max(margin, window.innerHeight - pickerH - margin);
        }
        setPos({ left, top });
      }, [anchorEl]);

      // Outside-Click + Esc + Scroll-Close
      useEffect(() => {
        const onDown = (e) => {
          if (ref.current && !ref.current.contains(e.target)
              && !(anchorEl && anchorEl.contains(e.target))) {
            onClose();
          }
        };
        const onEsc = (e) => { if (e.key === 'Escape') onClose(); };
        const onScroll = (e) => {
          // Scrollen INNERHALB des Pickers nicht schliessen
          if (ref.current && ref.current.contains(e.target)) return;
          onClose();
        };
        const t = setTimeout(() => {
          document.addEventListener('mousedown', onDown);
          document.addEventListener('keydown', onEsc);
          window.addEventListener('scroll', onScroll, true);
        }, 0);
        return () => {
          clearTimeout(t);
          document.removeEventListener('mousedown', onDown);
          document.removeEventListener('keydown', onEsc);
          window.removeEventListener('scroll', onScroll, true);
        };
      }, [anchorEl, onClose]);

      const apply = () => {
        const v = custom.trim();

    // UTF-8-sicheres Base64 (wichtig fuer Emojis)
    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }

    // Umgekehrt: Base64 -> UTF-8 String (GitHub-API Content-Feld)
    function base64ToUtf8(b64) {
      const clean = b64.replace(/\s/g, '');         // GitHub-Antwort enthaelt Zeilenumbrueche
      const binary = atob(clean);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    async function githubGetSha(cfg) {
      const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(cfg.path)}?ref=${encodeURIComponent(cfg.branch)}`;
      const res = await fetch(url, {
        headers: {
          'Authorization': `Bearer ${cfg.token}`,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28'
        }
      });
      if (res.status === 404) return null;       // Datei existiert noch nicht
      if (!res.ok) throw new Error(`GET fehlgeschlagen (${res.status}): ${await res.text()}`);
      const data = await res.json();
      return data.sha;
    }

    async function githubPutContent(cfg, content, sha) {
      const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(cfg.path)}`;
      const body = {
        message: `Artikelliste aktualisiert via Editor (${new Date().toISOString().slice(0, 16).replace('T', ' ')})`,
        content: utf8ToBase64(content),
        branch: cfg.branch
      };
      if (sha) body.sha = sha;
      if (cfg.authorName && cfg.authorEmail) {
        body.committer = { name: cfg.authorName, email: cfg.authorEmail };
      }
      const res = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${cfg.token}`,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const errTxt = await res.text();
        throw new Error(`PUT fehlgeschlagen (${res.status}): ${errTxt}`);
      }
      return res.json();
    }

    function App() {
      const [items, setItems] = useState(SAMPLE.artikel);
      const [filterKat, setFilterKat] = useState('Alle');
      const [search, setSearch] = useState('');
      const [editing, setEditing] = useState(null);
      const [sortBy, setSortBy] = useState('id');
      const [sortDir, setSortDir] = useState('asc');
      const [toast, setToast] = useState(null);
      const [dragging, setDragging] = useState(false);
      const [adding, setAdding] = useState(false);
      const [newItem, setNewItem] = useState({ kategorie: 'Eis', name: '', preis: '', icon: '' });
      const [picker, setPicker] = useState(null); // { kind:'new'|'edit', id?, anchorEl }
      const [dirty, setDirty] = useState(false);
      const [fileName, setFileName] = useState('produkte.json');
      const [showSettings, setShowSettings] = useState(false);
      const [ghCfg, setGhCfg] = useState(() => loadGhConfig());
      const [ghSaving, setGhSaving] = useState(false);
      const fileRef = useRef();

      const showToast = useCallback((msg, kind = '') => {
        setToast({ msg, kind });
        setTimeout(() => setToast(null), 2500);
      }, []);

      /* ---------- Drag & Drop fuer Dateien ---------- */
      useEffect(() => {
        let depth = 0;
        const onEnter = (e) => { e.preventDefault(); depth++; if (e.dataTransfer.types.includes('Files')) setDragging(true); };
        const onLeave = (e) => { e.preventDefault(); depth--; if (depth <= 0) { depth = 0; setDragging(false); } };
        const onOver  = (e) => { e.preventDefault(); };
        const onDrop  = (e) => {
          e.preventDefault(); depth = 0; setDragging(false);
          const file = e.dataTransfer.files[0];
          if (file) loadFile(file);
        };
        window.addEventListener('dragenter', onEnter);
        window.addEventListener('dragleave', onLeave);
        window.addEventListener('dragover',  onOver);
        window.addEventListener('drop',      onDrop);
        return () => {
          window.removeEventListener('dragenter', onEnter);
          window.removeEventListener('dragleave', onLeave);
          window.removeEventListener('dragover',  onOver);
          window.removeEventListener('drop',      onDrop);
        };
      }, []);

      /* ---------- Warnung bei ungespeichert ---------- */
      useEffect(() => {
        if (!dirty) return;
        const h = (e) => { e.preventDefault(); e.returnValue = ''; };
        window.addEventListener('beforeunload', h);
        return () => window.removeEventListener('beforeunload', h);
      }, [dirty]);

      /* ---------- Tastenkuerzel ---------- */
      useEffect(() => {
        const onKey = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault(); saveFile();
          } else if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
            e.preventDefault(); fileRef.current?.click();
          } else if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
            e.preventDefault(); setAdding(true);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      });

      /* ---------- File I/O ---------- */
      function loadFile(file) {
        if (!file.name.toLowerCase().endsWith('.json')) {
          showToast('Bitte eine .json-Datei wählen', 'error'); return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (!Array.isArray(data.artikel)) throw new Error('Schlüssel "artikel" fehlt');
            const cleaned = data.artikel.map(a => ({
              id: Number(a.id) || 0,
              kategorie: String(a.kategorie || ''),
              name: String(a.name || ''),
              preis: typeof a.preis === 'number' ? a.preis : parsePrice(a.preis),
              icon: String(a.icon || '•')
            }));
            setItems(cleaned);
            setFileName(file.name);
            setDirty(false);
            setEditing(null);
            showToast(`${cleaned.length} Artikel aus ${file.name} geladen`, 'success');
          } catch (err) {
            showToast('Fehler: ' + err.message, 'error');
          }
        };
        reader.readAsText(file, 'utf-8');
      }

      function download(content, name) {
        const blob = new Blob([content], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function saveFile() {
        if (items.length === 0) { showToast('Keine Artikel zum Speichern', 'error'); return; }
        download(buildJSON(items), fileName);
        setDirty(false);
        showToast(`${fileName} heruntergeladen`, 'success');
      }

      function saveBackup() {
        if (items.length === 0) { showToast('Keine Artikel zum Speichern', 'error'); return; }
        const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
        const base = fileName.replace(/\.json$/i, '');
        const name = `${base}_${ts}.json`;
        download(buildJSON(items), name);
        showToast(`Backup: ${name}`, 'success');
      }

      async function loadFromGitHub() {
        if (dirty) {
          if (!confirm('Es gibt ungespeicherte Aenderungen. Wirklich von GitHub neu laden und ueberschreiben?')) return;
        }
        setGhSaving(true);
        try {
          const url = `https://api.github.com/repos/${ghCfg.owner}/${ghCfg.repo}/contents/${encodeURIComponent(ghCfg.path)}?ref=${encodeURIComponent(ghCfg.branch)}`;
          const headers = {
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };
          // Token ist bei Public-Repos fuer GET optional, aber wenn vorhanden nutzen
          if (ghCfg.token) headers['Authorization'] = `Bearer ${ghCfg.token}`;

          const res = await fetch(url, { headers });
          if (!res.ok) {
            if (res.status === 404) throw new Error('Datei nicht gefunden - Repo/Pfad pruefen');
            if (res.status === 401) throw new Error('Token ungueltig oder abgelaufen');
            if (res.status === 403) throw new Error('Rate-Limit erreicht oder keine Berechtigung');
            throw new Error(`HTTP ${res.status}`);
          }
          const data = await res.json();
          if (!data.content) throw new Error('GitHub-Antwort ohne Inhalt');

          const text = base64ToUtf8(data.content);
          const parsed = JSON.parse(text);
          if (!parsed.artikel || !Array.isArray(parsed.artikel)) {
            throw new Error('JSON enthaelt kein artikel-Array');
          }
          setItems(parsed.artikel);
          setFileName(ghCfg.path);
          setDirty(false);
          showToast(`${parsed.artikel.length} Artikel von GitHub geladen`, 'success');
        } catch (e) {
          showToast(`Laden fehlgeschlagen: ${String(e.message || e).slice(0, 80)}`, 'error');
        } finally {
          setGhSaving(false);
        }
      }

      async function saveToGitHub() {
        if (items.length === 0) { showToast('Keine Artikel zum Speichern', 'error'); return; }
        if (!ghCfg.token) {
          showToast('Bitte zuerst Token in den Einstellungen hinterlegen', 'error');
          setShowSettings(true);
          return;
        }
        setGhSaving(true);
        try {
          const sha = await githubGetSha(ghCfg);  // null wenn Datei neu
          await githubPutContent(ghCfg, buildJSON(items), sha);
          setDirty(false);
          showToast(`Auf GitHub gespeichert: ${ghCfg.owner}/${ghCfg.repo}/${ghCfg.path}`, 'success');
        } catch (e) {
          const msg = String(e.message || e);
          if (msg.includes('401')) {
            showToast('Token ungueltig oder abgelaufen', 'error');
          } else if (msg.includes('403')) {
            showToast('Keine Berechtigung - Token-Scope pruefen (Contents: write)', 'error');
          } else if (msg.includes('404')) {
            showToast('Repository oder Pfad nicht gefunden - Einstellungen pruefen', 'error');
          } else if (msg.includes('409')) {
            showToast('Konflikt - jemand anderes hat die Datei gerade geaendert. Bitte neu laden.', 'error');
          } else {
            showToast(`Fehler: ${msg.slice(0, 90)}`, 'error');
          }
        } finally {
          setGhSaving(false);
        }
      }

          return { ...i, [field]: v };

        setDirty(true);

        const item = items.find(i => i.id === id);
        if (!confirm(`"${item?.name}" wirklich löschen?`)) return;
        setItems(items.filter(i => i.id !== id));
        setDirty(true);
        showToast('Artikel gelöscht', 'success');

          name: newItem.name.trim(),

        setDirty(true);

      function toggleSort(field) {
        if (sortBy === field) setSortDir(sortDir === 'asc' ? 'desc' : 'asc');
        else { setSortBy(field); setSortDir('asc'); }

      /* ---------- Derived ---------- */

        if (filterKat !== 'Alle') v = v.filter(i => i.kategorie === filterKat);
        if (search.trim()) {

              <h1 className="brand-title">Artikel<em>·</em>Editor</h1>
              </div>
            </div>
            <div className="toolbar">
              <input
                ref={fileRef} type="file" accept=".json,application/json"
                className="hidden"
                onChange={(e) => {
                  if (e.target.files[0]) loadFile(e.target.files[0]);
                  e.target.value = '';
                }}
              />
              <button className="btn btn-ghost" onClick={() => fileRef.current.click()} title="Strg+O - Lokale Datei oeffnen">
                ↑ Laden
              </button>
              <button
                className="btn btn-github"
                onClick={loadFromGitHub}
                disabled={ghSaving}
                title="Aktuelle produkte.json direkt aus dem GitHub-Repo holen"
              >
                <span className={`gh-status-dot ${ghCfg.token ? 'ready' : 'unset'}`}></span>
                {ghSaving ? '… lade' : '↓ GitHub'}
              </button>
              <button className="btn btn-ghost" onClick={saveBackup} title="Speichern mit Zeitstempel">
                ⎘ Backup
              </button>
              <button className="btn btn-accent" onClick={saveFile} title="Strg+S">
                ↓ Speichern
              </button>
              <button
                className="btn btn-github"
                onClick={saveToGitHub}
                disabled={ghSaving}
                title={ghCfg.token ? `Direkt nach ${ghCfg.owner}/${ghCfg.repo} pushen` : 'Token-Setup noetig'}
              >
                <span className={`gh-status-dot ${ghCfg.token ? 'ready' : 'unset'}`}></span>
                {ghSaving ? '… sende' : '☁ GitHub'}
              </button>
              <button
                className="btn btn-ghost"
                onClick={() => setShowSettings(true)}
                title="GitHub-Einstellungen"
              >
                ⚙
              </button>
            </div>
          </header>

          {showSettings && (
            <GitHubSettingsModal
              initialCfg={ghCfg}
              onSave={(newCfg) => {
                setGhCfg(newCfg);
                saveGhConfig(newCfg);
                setShowSettings(false);
                showToast('Einstellungen gespeichert', 'success');
              }}
              onClose={() => setShowSettings(false)}
            />
          )}

          <div className="stats">
            <div className="stat">
              <div className="stat-label">Artikel insgesamt</div>
              <div className="stat-value">{items.length}</div>
            </div>
            <div className="stat">
              <div className="stat-label">Aktive Kategorien</div>
              <div className="stat-value">
                {Object.entries(counts).filter(([k, v]) => k !== 'Alle' && v > 0).length}
              </div>
            </div>
            <div className="stat">
              <div className="stat-label">Listenpreis-Summe</div>
              <div className="stat-value">
                {fmtPrice(totalValue)}<span className="currency">€</span>
              </div>
            </div>
            <div className="stat">
              <div className="stat-label">Ø Preis</div>
              <div className="stat-value">
                {items.length ? fmtPrice(totalValue / items.length) : '—'}
                {items.length > 0 && <span className="currency">€</span>}
              </div>
            </div>
          </div>

          <div className="filters">
            <div className="tabs">
              {['Alle', ...KATEGORIEN].map(k => (
                <button
                  key={k}
                  className={`tab ${filterKat === k ? 'active' : ''}`}
                  onClick={() => setFilterKat(k)}
                >
                  {k}<span className="tab-count">{counts[k] || 0}</span>
                </button>
              ))}
            </div>
            <div className="search">
              <span className="search-icon">⌕</span>
              <input
                placeholder="Suchen…"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
              />
            </div>
          </div>

          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th className={`sortable ${sortBy === 'id' ? 'active-sort' : ''}`}
                      onClick={() => toggleSort('id')} style={{width: 70}}>
                    ID <span className="sort-indicator">{sortArrow('id')}</span>
                  </th>
                  <th style={{width: 70, textAlign: 'center'}}>Icon</th>
                  <th className={`sortable ${sortBy === 'name' ? 'active-sort' : ''}`}
                      onClick={() => toggleSort('name')}>
                    Name <span className="sort-indicator">{sortArrow('name')}</span>
                  </th>
                  <th className={`sortable ${sortBy === 'kategorie' ? 'active-sort' : ''}`}
                      onClick={() => toggleSort('kategorie')} style={{width: 140}}>
                    Kategorie <span className="sort-indicator">{sortArrow('kategorie')}</span>
                  </th>
                  <th className={`sortable ${sortBy === 'preis' ? 'active-sort' : ''}`}
                      onClick={() => toggleSort('preis')} style={{width: 110, textAlign: 'right'}}>
                    Preis <span className="sort-indicator">{sortArrow('preis')}</span>
                  </th>
                  <th style={{width: 60}}></th>
                </tr>
              </thead>
              <tbody>
                {view.length === 0 && !adding && (
                  <tr><td colSpan="6">
                    <div className="empty">
                      <div className="empty-icon">🍨</div>
                      <div className="empty-title">Keine Artikel gefunden</div>
                      <div>Filter zurücksetzen oder neuen Artikel anlegen.</div>
                    </div>
                  </td></tr>
                )}

                {view.map(item => (
                  <Row key={item.id} item={item}
                       editing={editing} setEditing={setEditing}
                       updateItem={updateItem} deleteItem={deleteItem}
                       setPicker={setPicker} />
                ))}

                {adding && (
                  <tr className="add-row">
                    <td className="cell-id">neu</td>
                    <td>
                      <button
                        type="button"
                        className={`icon-trigger ${!newItem.icon ? 'empty' : ''}`}
                        onClick={(e) => setPicker({ kind: 'new', anchorEl: e.currentTarget })}
                        title="Symbol wählen"
                      >
                        {newItem.icon || '＋'}
                      </button>
                    </td>
                    <td>
                      <input className="inline-input" autoFocus
                             value={newItem.name}
                             onChange={(e) => setNewItem({...newItem, name: e.target.value})}
                             onKeyDown={(e) => {
                               if (e.key === 'Enter') commitNew();
                               else if (e.key === 'Escape') setAdding(false);
                             }}
                             placeholder="Artikelname" />
                    </td>
                    <td>
                      <select className="inline-select"
                              value={newItem.kategorie}
                              onChange={(e) => setNewItem({...newItem, kategorie: e.target.value})}>
                        {KATEGORIEN.map(k => <option key={k} value={k}>{k}</option>)}
                      </select>
                    </td>
                    <td>
                      <input className="inline-input mono" style={{textAlign: 'right'}}
                             value={newItem.preis}
                             onChange={(e) => setNewItem({...newItem, preis: e.target.value})}
                             onKeyDown={(e) => {
                               if (e.key === 'Enter') commitNew();
                               else if (e.key === 'Escape') setAdding(false);
                             }}
                             placeholder="0,00" />
                    </td>
                    <td>
                      <div style={{display: 'flex', gap: 4, justifyContent: 'flex-end'}}>
                        <button className="icon-btn success" onClick={commitNew} title="Hinzufügen (Enter)">✓</button>
                        <button className="icon-btn danger" onClick={() => setAdding(false)} title="Abbrechen (Esc)">✕</button>
                      </div>
                    </td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>

          <div style={{marginTop: 16, display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 16, flexWrap: 'wrap'}}>
            <div className="hint">
              <span><kbd>Klick</kbd> Zelle bearbeiten</span>
              <span><kbd>Enter</kbd> übernehmen</span>
              <span><kbd>Esc</kbd> abbrechen</span>
              <span><kbd>Ctrl+S</kbd> speichern</span>
              <span><kbd>Ctrl+N</kbd> neu</span>
            </div>
            {!adding && (
              <button className="btn btn-primary" onClick={() => setAdding(true)}>
                + Neuer Artikel
              </button>
            )}
          </div>

          {picker && (
            <EmojiPicker
              anchorEl={picker.anchorEl}
              value={picker.kind === 'edit'
                ? (items.find(i => i.id === picker.id)?.icon || '')
                : newItem.icon}
              onSelect={(emoji) => {
                if (picker.kind === 'new') {
                  setNewItem(prev => ({ ...prev, icon: emoji }));
                } else {
                  updateItem(picker.id, 'icon', emoji);
                }
              }}
              onClose={() => setPicker(null)}
            />
          )}

          {toast && <div className={`toast ${toast.kind}`}>{toast.msg}</div>}
        </div>
      );
    }

    /* ============================ Row ============================ */
    function Row({ item, editing, setEditing, updateItem, deleteItem, setPicker }) {
      const isEditing = (field) => editing && editing.id === item.id && editing.field === field;
      const startEdit = (field) => setEditing({ id: item.id, field });
      const commit = (field, value) => { updateItem(item.id, field, value); setEditing(null); };
      const cancel = () => setEditing(null);

      const onKey = (field) => (e) => {
        if (e.key === 'Enter') commit(field, e.target.value);
        else if (e.key === 'Escape') cancel();
      };

      return (
        <tr className="row">
          {/* ID */}
          <td className="cell-id">
            {isEditing('id') ? (
              <input className="inline-input mono" autoFocus defaultValue={item.id}
                onKeyDown={onKey('id')}
                onBlur={(e) => commit('id', e.target.value)} />
            ) : (
              <span className="cell-edit" onClick={() => startEdit('id')}>{item.id}</span>
            )}
          </td>

          {/* Icon — oeffnet Emoji-Picker */}
          <td>
            <button
              type="button"
              className="cell-edit cell-icon"
              style={{ background: 'none', border: 'none', cursor: 'pointer', width: '100%' }}
              onClick={(e) => {
                setEditing(null);
                setPicker({ kind: 'edit', id: item.id, anchorEl: e.currentTarget });
              }}
              title="Symbol ändern"
            >
              {item.icon}
            </button>
          </td>

          {/* Name */}
          <td>
            {isEditing('name') ? (
              <input className="inline-input" autoFocus defaultValue={item.name}
                onKeyDown={onKey('name')}
                onBlur={(e) => commit('name', e.target.value)} />
            ) : (
              <span className="cell-edit" onClick={() => startEdit('name')}>{item.name}</span>
            )}
          </td>

          {/* Kategorie */}
          <td>
            {isEditing('kategorie') ? (
              <select className="inline-select" autoFocus defaultValue={item.kategorie}
                onChange={(e) => commit('kategorie', e.target.value)}
                onBlur={(e) => commit('kategorie', e.target.value)}>
                {KATEGORIEN.map(k => <option key={k} value={k}>{k}</option>)}
              </select>
            ) : (
              <span className="cell-edit" onClick={() => startEdit('kategorie')}>
                <span className={`badge badge-${item.kategorie}`}>{item.kategorie}</span>
              </span>
            )}
          </td>

          {/* Preis */}
          <td className="cell-price">
            {isEditing('preis') ? (
              <input className="inline-input mono" style={{textAlign: 'right'}}
                autoFocus defaultValue={fmtPrice(item.preis)}
                onKeyDown={onKey('preis')}
                onBlur={(e) => commit('preis', e.target.value)} />
            ) : (
              <span className="cell-edit" style={{textAlign: 'right'}} onClick={() => startEdit('preis')}>
                {fmtPrice(item.preis)} €
              </span>
            )}
          </td>

          {/* Aktionen */}
          <td>
            <div className="row-actions">
              <button className="icon-btn danger" onClick={() => deleteItem(item.id)} title="Löschen">✕</button>
            </div>
          </td>
        </tr>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
